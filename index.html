<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghoustory Control Room</title>
    <!-- Tailwind CSS untuk desain instan yang bagus -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050505',
                        darkCard: '#121212',
                        ghoulRed: '#B91C1C',
                        ghoulRedHover: '#991B1B'
                    },
                    fontFamily: {
                        mystery: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e5e5e5; }
        .neon-red { box-shadow: 0 0 15px rgba(185, 28, 28, 0.5); }
        .glass-panel { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(10px); border: 1px solid #333; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-ghoulRed selection:text-white">

    <!-- Navbar -->
    <nav class="border-b border-red-900 bg-darkBg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- Logo Asli Ghoustory -->
                <img src="image_2.png" alt="Logo Ghoustory" class="h-12 w-auto object-contain drop-shadow-[0_0_8px_rgba(255,0,0,0.8)]">
                <h1 class="text-2xl font-mystery font-bold tracking-widest text-white hidden sm:block">GHOUSTORY <span class="text-ghoulRed">CONTROL ROOM</span></h1>
            </div>
            <div class="text-sm text-gray-400 font-mystery tracking-wider">
                <i class="fa-solid fa-circle text-green-500 text-xs mr-1 animate-pulse"></i> System Online
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Kolom Kiri: Upload & Preview Video -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Upload Area -->
            <div class="glass-panel p-8 rounded-xl text-center border-dashed border-2 border-gray-700 hover:border-ghoulRed transition-colors cursor-pointer relative group">
                <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" id="video-upload" accept="video/*">
                <div class="space-y-4">
                    <i class="fa-solid fa-film text-5xl text-gray-500 group-hover:text-ghoulRed transition-colors"></i>
                    <h2 class="text-xl font-semibold">Tarik & Lepas Video Misterimu</h2>
                    <p class="text-gray-400 text-sm">MP4, MOV, WebM (Maks. 1GB untuk Free Tier)</p>
                    <button class="bg-darkCard border border-gray-600 px-6 py-2 rounded-md hover:bg-gray-800 transition">Pilih File</button>
                </div>
            </div>

            <!-- AI Subtitle & Metadata Settings -->
            <div class="glass-panel p-6 rounded-xl space-y-4">
                <h3 class="text-lg font-mystery text-white border-b border-gray-700 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-ghoulRed"></i> Gemini AI Engine
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <!-- Tombol Generate Subtitle -->
                    <button class="w-full bg-darkCard border border-ghoulRed text-white py-3 rounded-lg hover:bg-ghoulRed hover:text-white transition flex justify-center items-center gap-2 neon-red">
                        <i class="fa-solid fa-language"></i> Generate Subtitle (Jawa &rarr; Indo)
                    </button>
                    <!-- Tombol Generate Judul -->
                    <button class="w-full bg-darkCard border border-gray-600 text-gray-300 py-3 rounded-lg hover:bg-gray-800 transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-hashtag"></i> Buat Judul, Tag & Cover
                    </button>
                </div>

                <!-- Textarea Preview AI -->
                <div class="mt-4">
                    <label class="block text-sm text-gray-400 mb-2">Draft Judul & Hashtag (Bisa diedit):</label>
                    <textarea class="w-full bg-black border border-gray-700 rounded-lg p-3 text-gray-300 focus:outline-none focus:border-ghoulRed h-24" placeholder="Menunggu AI Gemini bekerja..."></textarea>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: Platform Target & Publish -->
        <div class="glass-panel p-6 rounded-xl h-fit sticky top-24">
            <h3 class="text-lg font-mystery text-white border-b border-gray-700 pb-2 mb-4">Pilih Portal Dimensi</h3>
            
            <!-- Platform Checkboxes -->
            <div class="space-y-4">
                <label class="flex items-center justify-between p-3 border border-gray-700 rounded-lg hover:bg-gray-900 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-tiktok text-white text-xl"></i>
                        <span class="font-medium">TikTok</span>
                    </div>
                    <input type="checkbox" checked class="w-5 h-5 accent-ghoulRed bg-gray-800 border-gray-600 rounded">
                </label>

                <label class="flex items-center justify-between p-3 border border-gray-700 rounded-lg hover:bg-gray-900 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-youtube text-red-500 text-xl"></i>
                        <span class="font-medium">YouTube Shorts/Video</span>
                    </div>
                    <input type="checkbox" checked class="w-5 h-5 accent-ghoulRed bg-gray-800 border-gray-600 rounded">
                </label>

                <label class="flex items-center justify-between p-3 border border-gray-700 rounded-lg hover:bg-gray-900 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-facebook text-blue-500 text-xl"></i>
                        <span class="font-medium">Facebook Reels/Page</span>
                    </div>
                    <input type="checkbox" checked class="w-5 h-5 accent-ghoulRed bg-gray-800 border-gray-600 rounded">
                </label>
            </div>

            <!-- Publish Button -->
            <button class="w-full mt-8 bg-ghoulRed text-white font-bold py-4 rounded-lg hover:bg-ghoulRedHover transition text-lg shadow-[0_0_20px_rgba(185,28,28,0.6)] uppercase tracking-wider">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Mulai Penyebaran
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900 mt-12 py-6 text-center text-gray-600 text-sm">
        <p>&copy; 2026 Ghoustory Control Room. Powered by Gemini AI & Supabase.</p>
    </footer>

</body>
</html>
