name: Deploy Ghoustory Control Room to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Clear stale GitHub Pages deployment lock
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = 'f01fdd399a326e240a4dcabad512ba7305397bc1';
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              sha: staleSha,
              environment: 'github-pages',
              per_page: 100
            });
            for (const deployment of deployments) {
              if (deployment.sha !== staleSha || deployment.environment !== 'github-pages') continue;
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Clear stale Pages deployment blocking the current release.'
              });
              core.info(`Marked stale Pages deployment ${deployment.id} inactive.`);
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
