name: Deploy Ghoustory Control Room to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate game JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.external = False
                  self.current = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.inside = True
                      self.external = any(k.lower() == 'src' for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.inside and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.inside:
                      code = ''.join(self.current)
                      if code.strip():
                          self.blocks.append(code)
                      self.inside = False
                      self.external = False

          parser = Scripts()
          parser.feed(Path('assets/games/desa-terlarang/index.html').read_text(encoding='utf-8'))
          if not parser.blocks:
              raise SystemExit('No inline game scripts found')
          for i, code in enumerate(parser.blocks):
              Path(f'/tmp/desa-terlarang-{i}.js').write_text(code, encoding='utf-8')
          print(f'Found {len(parser.blocks)} inline scripts')
          PY
          for file in /tmp/desa-terlarang-*.js; do node --check "$file"; done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Clear stale GitHub Pages deployment lock
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = 'f01fdd399a326e240a4dcabad512ba7305397bc1';
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              sha: staleSha,
              environment: 'github-pages',
              per_page: 100
            });
            for (const deployment of deployments) {
              if (deployment.sha !== staleSha || deployment.environment !== 'github-pages') continue;
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Clear stale Pages deployment blocking the current release.'
              });
              core.info(`Marked stale Pages deployment ${deployment.id} inactive.`);
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
