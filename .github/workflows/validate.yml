name: Validate Ghoustory Control Room

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/six-core-areas]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check workspace JavaScript
        run: node --check workspace-hub.js
      - name: Check inline application scripts
        run: node scripts/validate-inline-scripts.mjs
      - name: Type-check AI Edge Function
        run: deno check supabase/functions/ghoustory-ai/index.ts
