name: Import free horror ambience

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-horror-ambience.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download Mixkit audio
        run: |
          mkdir -p assets/games/desa-terlarang/audio
          curl --fail --location --retry 3 \
            "https://assets.mixkit.co/active_storage/sfx/2482/2482.wav" \
            --output assets/games/desa-terlarang/audio/horror-ambience.wav
          test "$(stat -c%s assets/games/desa-terlarang/audio/horror-ambience.wav)" -gt 1000000
          file assets/games/desa-terlarang/audio/horror-ambience.wav

      - name: Commit audio asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/games/desa-terlarang/audio/horror-ambience.wav
          git commit -m "Add free horror ambience audio asset"
          git push
