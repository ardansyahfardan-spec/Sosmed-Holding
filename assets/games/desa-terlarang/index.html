<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>GHOUSTORY: DESA TERLARANG</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090d18;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    main{width:min(100%,560px);padding:36px 24px;border:1px solid #29354b;border-radius:18px;background:linear-gradient(145deg,#111a2b,#0b101c);box-shadow:0 20px 70px #0008}
    .mark{font-size:12px;letter-spacing:.22em;color:#8ba8d9;font-weight:700}
    h1{font-size:clamp(25px,5vw,38px);line-height:1.1;margin:14px 0;color:#fff}
    p{color:#b9c3d4;line-height:1.65;margin:0}
    .status{display:inline-block;margin-top:24px;padding:9px 14px;border:1px solid #6b3444;border-radius:999px;color:#ffb1bd;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="mark">GHOUSTORY ARENA</div>
    <h1>DESA TERLARANG</h1>
    <p>Permainan sedang dibangun ulang dari awal. Versi lama telah dikosongkan agar sistem permainan baru dapat dibuat dengan fondasi yang bersih.</p>
    <div class="status">Dalam pembangunan ulang</div>
  </main>
</body>
</html>
