<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>GHOUSTORY: DESA TERLARANG</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#f5f2eb;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2vw,26px);background:linear-gradient(180deg,#050912a8,transparent 25%,transparent 72%,#05091288)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:clamp(10px,1.3vw,13px);letter-spacing:.24em;color:#c5d2e8;font-weight:800}
.chapter{font-size:clamp(9px,1.1vw,11px);letter-spacing:.18em;color:#d08d8d;margin-top:7px}
.pill{border:1px solid #aab8d044;border-radius:999px;background:#0a1024a8;padding:8px 12px;color:#dbe4f5;font-size:11px}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hint{font-size:11px;line-height:1.5;color:#d1d8e5;max-width:290px;text-shadow:0 2px 8px #000}
.actions{display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #8da1c455;border-radius:12px;background:#10182acc;color:#f5f2eb;padding:11px 14px;font-weight:700;font-size:12px}
button:active{transform:scale(.97);background:#273650}
#portrait{display:none;position:fixed;inset:0;z-index:5;background:#080b12;align-items:center;justify-content:center;text-align:center;padding:30px}
#portrait div{max-width:290px}
#portrait strong{display:block;font-size:20px;margin-bottom:8px}
#portrait p{font-size:13px;line-height:1.6;color:#b7c2d5}
@media(orientation:portrait){#portrait{display:flex}}
@media(orientation:landscape) and (max-height:420px){.bottom{align-items:flex-end}.hint{max-width:220px}.pill{padding:6px 9px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Dunia GHOUSTORY Desa Terlarang"></canvas>
<div id="hud">
 <div class="top">
  <div><div class="brand">GHOUSTORY ARENA</div><div class="chapter">DESA TERLARANG · PROLOG</div></div>
  <div class="pill" id="world-state">DUNIA DIMUAT</div>
 </div>
 <div class="bottom">
  <div class="hint" id="hint">Kabut menyelimuti jalan masuk desa. Sesuatu bergerak di balik rumah-rumah tua.</div>
  <div class="actions"><button id="fullscreen" type="button">LAYAR PENUH</button></div>
 </div>
</div>
<div id="portrait"><div><strong>Putar perangkatmu</strong><p>GHOUSTORY: DESA TERLARANG dimainkan dalam posisi landscape.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
 'use strict';
 const canvas=document.getElementById('game');
 const state=document.getElementById('world-state');
 const hint=document.getElementById('hint');
 const fullscreen=document.getElementById('fullscreen');
 if(!window.THREE){state.textContent='GAGAL MEMUAT ENGINE';hint.textContent='Engine grafis belum tersedia. Periksa koneksi lalu muat ulang.';return;}
 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080d18);
 scene.fog=new THREE.FogExp2(0x111827,0.027);
 const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);
 camera.position.set(0,7,18);
 camera.lookAt(0,1,0);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
 renderer.setSize(innerWidth,innerHeight,false);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 scene.add(new THREE.HemisphereLight(0x9aafd0,0x15110e,1.15));
 const moonLight=new THREE.DirectionalLight(0x9db8e8,1.4);
 moonLight.position.set(-12,22,8);moonLight.castShadow=true;scene.add(moonLight);
 const moon=new THREE.Mesh(new THREE.SphereGeometry(2,24,24),new THREE.MeshBasicMaterial({color:0xd9e4f5}));
 moon.position.set(-24,22,-55);scene.add(moon);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x182019,roughness:1}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
 const path=new THREE.Mesh(new THREE.PlaneGeometry(7,100),new THREE.MeshStandardMaterial({color:0x34302a,roughness:1}));
 path.rotation.x=-Math.PI/2;path.position.set(0,.005,-28);scene.add(path);
 function box(w,h,d,color,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.95}));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
 }
 function hut(x,z,scale=1){
  const w=5*scale,h=3.2*scale,d=4.5*scale;
  box(w,h,d,0x39332d,x,h/2,z);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(4.1*scale,2.4*scale,4),new THREE.MeshStandardMaterial({color:0x211e20,roughness:1}));
  roof.rotation.y=Math.PI/4;roof.position.set(x,h+1.05*scale,z);roof.castShadow=true;scene.add(roof);
  box(.75*scale,1.6*scale,.12,0x17191d,x,h*.34,z+d/2+.07);
  const glow=new THREE.PointLight(0xd18a4c,.65,8);glow.position.set(x-1,h*.6,z+d/2+1);scene.add(glow);
 }
 function tree(x,z,s=1){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.35*s,2.4*s,7),new THREE.MeshStandardMaterial({color:0x28221d}));
  trunk.position.set(x,1.2*s,z);trunk.castShadow=true;scene.add(trunk);
  for(let i=0;i<3;i++){
   const crown=new THREE.Mesh(new THREE.ConeGeometry((1.5-i*.18)*s,2.8*s,7),new THREE.MeshStandardMaterial({color:i===1?0x17231e:0x1c2922,roughness:1}));
   crown.position.set(x,(3+i*.72)*s,z);crown.castShadow=true;scene.add(crown);
  }
 }
 for(let i=0;i<12;i++){
  const z=-i*8-8;
  tree(-8-(i%3)*2,z,.9+(i%2)*.25);tree(8+(i%4)*1.6,z-3,.85+(i%3)*.2);
 }
 hut(-7,-17,1);hut(7,-31,.95);hut(-8,-48,1.15);hut(9,-61,1.05);
 // Siluet pagar dan batu pembatas di sisi jalan.
 for(let i=0;i<18;i++){
  const z=-i*5-5;
  box(.18,.8,.18,0x39342e,-4.4,.4,z);
  box(.18,.8,.18,0x39342e,4.4,.4,z-2);
 }
 const mist=[];
 for(let i=0;i<24;i++){
  const material=new THREE.MeshBasicMaterial({color:0xaab8c9,transparent:true,opacity:.035,depthWrite:false});
  const cloud=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),material);
  cloud.scale.set(3+Math.random()*4,.35+Math.random()*.35,1.4);
  cloud.position.set((Math.random()-.5)*22,.35+Math.random()*1.2,-Math.random()*75);
  scene.add(cloud);mist.push(cloud);
 }
 state.textContent='DUNIA SIAP';
 let last=0;
 function frame(t){
  requestAnimationFrame(frame);
  const time=t*.0001;
  mist.forEach((m,i)=>{m.position.x+=Math.sin(time+i)*.0018;if(m.position.x>13)m.position.x=-13;});
  camera.position.x=Math.sin(time*.55)*.12;
  camera.lookAt(0,1,-18);
  renderer.render(scene,camera);
  last=t;
 }
 requestAnimationFrame(frame);
 function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));}
 addEventListener('resize',resize,{passive:true});
 fullscreen.addEventListener('click',async()=>{
  try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){hint.textContent='Mode layar penuh tidak didukung oleh browser ini.';}
 });
 try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
})();
</script>
</body>
</html>
